<!-- Slideshow carousel: custom timer bypasses Bootstrap slide transitions -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.portfolio-modal').forEach(function(modal) {
    modal.addEventListener('shown.bs.modal', function() {
      var carousel = modal.querySelector('.carousel.carousel-fade');
      if (!carousel) return;
      var items = carousel.querySelectorAll('.carousel-inner .carousel-item');
      if (items.length < 2) return;

      // Pause Bootstrap's own interval — our timer drives .active toggling.
      bootstrap.Carousel.getOrCreateInstance(carousel).pause();

      var idx = 0;
      items.forEach(function(item, i) { if (item.classList.contains('active')) idx = i; });
      var dur = parseInt(carousel.dataset.bsInterval, 10) || 5000;

      var timer = setInterval(function() {
        items[idx].classList.remove('active');
        idx = (idx + 1) % items.length;
        items[idx].classList.add('active');
      }, dur);

      carousel._slideshowTimer = timer;
    });

    modal.addEventListener('hide.bs.modal', function() {
      var carousel = modal.querySelector('.carousel.carousel-fade');
      if (!carousel) return;
      var timer = carousel._slideshowTimer;
      if (timer) {
        clearInterval(timer);
        carousel._slideshowTimer = null;
      }
      // Reset to first image for next open.
      var items = carousel.querySelectorAll('.carousel-inner .carousel-item');
      items.forEach(function(item) { item.classList.remove('active'); });
      if (items.length > 0) items[0].classList.add('active');
    });
  });
});
</script>
