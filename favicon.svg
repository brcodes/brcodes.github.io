<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- White circle fill -->
  <circle cx="16" cy="16" r="16" fill="white"/>
  <!-- Green inner border ring (stroke centered at r=14.5 → outer edge flush with circle) -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#18bc9c" stroke-width="3"/>
  <!-- Dark blue cross: vertical bar, top rounded (rx=0.5), bottom curved to circle arc -->
  <path d="M 13,5.5 A 0.5,0.5 0 0,1 13.5,5 L 18.5,5 A 0.5,0.5 0 0,1 19,5.5 L 19,32 A 16,16 0 0,1 13,32 Z" fill="#2c3e50"/>
  <!-- Dark blue cross: horizontal bar, moved down 1px (arms now equal to top extent = 7px) -->
  <rect x="6" y="12" width="20" height="6" fill="#2c3e50" rx="0.5"/>
</svg>
